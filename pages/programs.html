<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f8fc">
<meta name="description" content="内容已合并到计划与培养。">
<title>计划与培养 · 掌玩人才发展项目</title>
<script>
try{
  var t = localStorage.getItem('zw-v2-theme');
  if(!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
  document.documentElement.className += ' js';
}catch(e){}
</script>
<style>
:root{
  --bg:#f6f8fc; --surface:#ffffff; --surface-2:#f8fafc;
  --line:#e3e9f2; --line-strong:#c9d4e4;
  --text:#111b2e; --muted:#4a5a72; --faint:#6f8099;
  --accent:#2f6bff; --accent-2:#0d9fbd;
  --accent-soft:#edf3ff; --accent-line:#c7d8ff;
  --glow:rgba(47,107,255,.10);
  --shadow:0 10px 30px rgba(24,42,74,.07);
  /* 统一形状与排版标尺：所有圆角/间距/字号只从这里取值，避免参差不齐 */
  --r-lg:14px; --r-md:11px; --r-sm:9px; --r-pill:999px;
  --gap:14px; --gap-lg:18px;
  --fs-h1:clamp(31px,3.6vw,42px); --fs-h2:26px; --fs-h3:16px;
  --fs-lead:17px; --fs-body:15px; --fs-sm:13.5px; --fs-cap:11px;
  /* 图标瓦片四色：蓝 / 青 / 紫 / 暖，低饱和渐变底，局部强调 */
  --t1:#2f6bff; --t1bg:#edf3ff; --t1ln:#c7d8ff;
  --t2:#0d9fbd; --t2bg:#e8f7fa; --t2ln:#bfe6ef;
  --t3:#7c5cff; --t3bg:#f0edff; --t3ln:#d9d1ff;
  --t4:#e0663a; --t4bg:#fff1ea; --t4ln:#ffd6c2;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
}
html[data-theme="dark"]{
  --bg:#0c1320; --surface:#131d2e; --surface-2:#182438;
  --line:#24334a; --line-strong:#354863;
  --text:#e9eff8; --muted:#b6c4d8; --faint:#91a3bd;
  --accent:#7ba3ff; --accent-2:#3dd0e4;
  --accent-soft:#17243d; --accent-line:#2e4a7d;
  --glow:rgba(90,140,255,.14);
  --shadow:0 10px 30px rgba(0,0,0,.28);
  --t1:#7ba3ff; --t1bg:#1a2c4d; --t1ln:#2e4a7d;
  --t2:#3dd0e4; --t2bg:#123340; --t2ln:#1d5566;
  --t3:#a992ff; --t3bg:#282346; --t3ln:#463a75;
  --t4:#ff9b73; --t4bg:#3d2a22; --t4ln:#6b4334;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.75 var(--sans);-webkit-font-smoothing:antialiased}

a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent-line);color:var(--text)}
section{scroll-margin-top:88px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono)}
.skip{position:absolute;left:-9999px;top:0;background:var(--surface);padding:10px 16px;z-index:200}
.skip:focus{left:8px;top:8px;border:1px solid var(--accent)}

/* ---------- 页眉 ---------- */
.top{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--line)}
.top.scrolled{box-shadow:var(--shadow)}
.top .wrap{height:64px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;white-space:nowrap;letter-spacing:.01em}
.brand .mark{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font:700 11px var(--mono);letter-spacing:.02em;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.brand-logo{height:44px;width:auto;display:block;flex:none}
html[data-theme="dark"] .brand-logo{filter:brightness(1.55) saturate(1.15)}
.nav{display:flex;gap:2px;margin-left:auto;align-items:center}
.nav a{padding:11px 13px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;min-height:44px;display:flex;align-items:center;transition:color .18s,border-color .18s}
.nav a:hover,.nav a.active{color:var(--text);border-bottom-color:var(--accent)}
.actions{display:flex;align-items:center;gap:8px}
.icon-btn{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:15px;transition:border-color .18s,background .18s}
.icon-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.icon-btn:active,.btn:active,.nav a:active,summary:active,.to-top:active{transform:translateY(1px)}
.hamburger{display:none}
.drawer{display:none}
.drawer.open{display:block;position:fixed;z-index:55;top:64px;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow);padding:8px 24px 18px}
.drawer a{display:flex;align-items:center;min-height:48px;border-bottom:1px solid var(--line);font-size:15px}
.drawer a.active{color:var(--accent);font-weight:600}
.drawer .drawer-foot{display:flex;align-items:center;gap:12px;padding-top:14px;font-size:13px;color:var(--muted)}

/* ---------- Hero ---------- */
.hero{position:relative;isolation:isolate;overflow:hidden;padding:74px 0 58px;border-bottom:1px solid var(--line);background:var(--bg)}
.hero:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.16;mask-image:linear-gradient(90deg,transparent 30%,#000 100%);-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 100%)}
.hero .wrap{position:relative;z-index:3}
.hero-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:44px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:600 11px var(--mono);letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:16px}
.eyebrow:before{content:"";width:22px;height:1px;background:var(--accent)}
.hero h1{font-size:var(--fs-h1);line-height:1.26;margin:0 0 16px;letter-spacing:.005em;font-weight:700}
.hero h1 em{font-style:normal;color:var(--accent);position:relative;white-space:nowrap}
.hero h1 em:after{content:"";position:absolute;left:0;right:0;bottom:2px;height:6px;background:var(--accent-soft);z-index:-1}
.hero .lead{font-size:var(--fs-lead);color:var(--text);margin:0 0 8px;font-weight:500}
.hero .third{font-size:var(--fs-sm);color:var(--muted);margin:0 0 28px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);margin-bottom:28px}
.fact{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px 8px;text-align:center;font-size:13px;transition:border-color .18s,transform .18s}
.fact:hover{border-color:var(--accent-line);transform:translateY(-2px)}
.fact .mono{display:block;font-size:var(--fs-cap);letter-spacing:.1em;color:var(--faint);margin-bottom:5px}
.link-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border:1px solid var(--line-strong);border-radius:var(--r-sm);font-size:14px;background:var(--surface);transition:border-color .18s,transform .18s,box-shadow .18s}
.btn:hover{border-color:var(--accent);box-shadow:0 4px 14px var(--glow)}
.btn.solid{background:var(--accent);color:#fff;border-color:var(--accent)}
html[data-theme="dark"] .btn.solid{color:#0c1320}
.btn.solid:hover{box-shadow:0 6px 18px var(--glow)}
.hero-art{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:18px;box-shadow:var(--shadow)}
.hero-art svg{width:100%;height:auto;display:block}
.hero-art .band{stroke:var(--line);stroke-width:1}
.hero-art .capP{fill:var(--t3bg);stroke:var(--t3ln);stroke-width:1}
.hero-art .capM{fill:var(--t1bg);stroke:var(--t1ln);stroke-width:1}
.hero-art .capTextP{fill:var(--t3);font:600 11px var(--sans);letter-spacing:.04em}
.hero-art .capTextM{fill:var(--t1);font:600 11px var(--sans);letter-spacing:.04em}
.hero-art .railP{fill:none;stroke:url(#pLine);stroke-width:2.5;stroke-linecap:round}
.hero-art .railM{fill:none;stroke:url(#mLine);stroke-width:2.5;stroke-linecap:round}
.hero-art .dotP{fill:var(--surface);stroke:var(--t3);stroke-width:2.5}
.hero-art .dotM{fill:var(--surface);stroke:var(--t1);stroke-width:2.5}
.hero-art .bridge{fill:none;stroke:var(--line-strong);stroke-width:1;stroke-dasharray:3 4}
.hero-art .fork{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;opacity:.85}
.hero-art .feed{fill:none;stroke:var(--accent-2);stroke-width:1.4;stroke-linecap:round;opacity:.6}
.hero-art .hub{fill:var(--accent);stroke:var(--surface);stroke-width:2.5}
.hero-art .lbl{fill:var(--muted);font:10.5px var(--sans)}
.hero-art .lbl.strong{fill:var(--text);font:600 11px var(--sans)}
.hero-art .noteLbl{fill:var(--faint);font:9px var(--sans);letter-spacing:.06em}
.hero-art .entryLbl{fill:var(--muted);font:10px var(--sans);letter-spacing:.08em}

/* ---------- 高级感层：极光 / 点阵 / 聚光 / 颗粒 ---------- */
/* Aurora：参考 React Bits 的柔和极光——多层光带缓慢漂移，纯 GPU transform，无逐帧重绘 */
.hero:after{content:"";position:absolute;inset:-20% -12%;z-index:0;pointer-events:none;
  background:
    radial-gradient(38% 30% at 72% 18%,var(--glow),transparent 72%),
    radial-gradient(32% 26% at 88% 58%,rgba(13,159,189,.13),transparent 74%),
    radial-gradient(30% 24% at 32% 82%,rgba(94,140,255,.09),transparent 74%);
  transform:translate3d(0,0,0);animation:auroraDrift 20s ease-in-out infinite alternate;will-change:transform}
/* 跟随光：只有鼠标移动时才改写 --ax/--ay，浏览器合成层平移，不触发重排重绘 */
.aurora-mouse{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .5s ease;
  background:radial-gradient(320px circle at var(--ax,50%) var(--ay,50%),var(--glow),transparent 68%)}
.hero.mouse-on .aurora-mouse{opacity:1}
html[data-theme="dark"] .hero:after{background:radial-gradient(38% 30% at 72% 18%,rgba(90,140,255,.22),transparent 72%),radial-gradient(32% 26% at 88% 58%,rgba(61,208,228,.16),transparent 74%),radial-gradient(30% 24% at 32% 82%,rgba(120,100,255,.12),transparent 74%)}
@keyframes auroraDrift{from{transform:translate3d(-2%,1%,0) scale(1)}to{transform:translate3d(3%,-2%,0) scale(1.08)}}
.card:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .28s;background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),var(--glow),transparent 62%)}
.card:hover:before{opacity:1}
.card>*{position:relative;z-index:1}
.btn{position:relative;overflow:hidden}
.btn:after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-18deg);transition:left .55s ease}
.btn:hover:after{left:130%}
html[data-theme="dark"] .btn:after{background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent)}
.eyebrow:after{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent-2);animation:blip 2.6s ease-out infinite}
@keyframes blip{0%{box-shadow:0 0 0 0 var(--glow)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.block-head .num{box-shadow:0 0 0 3px var(--glow)}
.block-head h2:after{content:"";display:inline-block;width:46px;height:1px;margin-left:13px;vertical-align:middle;background:linear-gradient(90deg,var(--line-strong),transparent)}
.hero-art .draw{stroke-dasharray:100;stroke-dashoffset:100;animation:drawPath 1.5s ease forwards .25s}
@keyframes drawPath{to{stroke-dashoffset:0}}
.hero-art .ripple{fill:none;stroke:var(--accent);stroke-width:1;opacity:0;transform-box:fill-box;transform-origin:center;animation:ripple 3.4s ease-out infinite 1.2s}
@keyframes ripple{0%{opacity:.55;transform:scale(.4)}80%,100%{opacity:0;transform:scale(2.6)}}
.progress{position:absolute;left:0;bottom:-1px;height:2px;width:0;z-index:2;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .08s linear}

/* ---------- 图标系统（内联 SVG sprite，零外部资源） ---------- */
.svg-sprite{position:absolute;width:0;height:0;overflow:hidden}
.ico{width:22px;height:22px;display:block;flex:none}
/* 图标瓦片：大厂常见的圆角渐变容器 + 线性图标 */
.tile{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;
  color:var(--t1);background:var(--t1bg);border:1px solid var(--t1ln);
  transition:transform .25s,box-shadow .25s}
.tile .ico{width:20px;height:20px}
.tile.t2{color:var(--t2);background:var(--t2bg);border-color:var(--t2ln)}
.tile.t3{color:var(--t3);background:var(--t3bg);border-color:var(--t3ln)}
.tile.t4{color:var(--t4);background:var(--t4bg);border-color:var(--t4ln)}
.card:hover .tile{transform:translateY(-2px) rotate(-3deg);box-shadow:0 6px 14px var(--glow)}
/* 有图标的卡片：瓦片 + 文字，横向更紧凑的头部 */
.card.ico-head{display:flex;flex-direction:column;align-items:flex-start}
.card.ico-head .tile{margin-bottom:13px}
.card.ico-head h3{margin-top:2px}
/* 统计卡图标：图标置于数值上方，弱化描边 */
.stat .tile{margin:0 auto 9px;width:34px;height:34px;border-radius:9px}
.stat .tile .ico{width:18px;height:18px}
/* 方向卡：小图标 + 大编号同排 */
.direction-head{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:11px}
.direction-head .tile{width:34px;height:34px;border-radius:9px}
.direction-head .tile .ico{width:18px;height:18px}
.direction-head .idx{margin:0;font-size:17px;color:var(--accent-line)}
/* surface 小标题：图标瓦片 + 文字，整行左对齐 */
.sub.sub-ico{display:flex;align-items:center;gap:10px}
.sub-ico .tile{width:28px;height:28px;border-radius:8px}
.sub-ico .tile .ico{width:15px;height:15px}
.sub-ico .mono{margin-right:8px}
/* 流程步骤图标 */
.step .tile{width:34px;height:34px;border-radius:9px;margin-bottom:12px}
.step .tile .ico{width:18px;height:18px}
.steps-ico .dot{display:none}
.steps-ico:before{top:33px}


/* ---------- 通用块 ---------- */
main{padding-bottom:0}
.block{padding:54px 0;border-bottom:1px solid var(--line)}
.block:nth-of-type(even){background:var(--surface-2)}
.block-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 6px}
.block-head .num{font:700 12px var(--mono);color:var(--accent);border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r-sm);padding:4px 9px;display:inline-flex;align-items:center;min-height:26px}
.block-head h2{margin:0;font-size:var(--fs-h2);letter-spacing:.01em;line-height:1.4}
.block .goal{color:var(--muted);font-size:var(--fs-sm);margin:0 0 26px}
.surface{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:20px;transition:border-color .18s}
.surface:hover{border-color:var(--line-strong)}
.surface + .surface{margin-top:var(--gap)}
.grid2 > .surface + .surface,.grid3 > .surface + .surface,.grid4 > .surface + .surface{margin-top:0}
.sub{font-size:13px;font-weight:650;margin:0 0 14px;color:var(--text)}
.sub .mono{color:var(--accent);font-weight:600;font-size:var(--fs-cap);letter-spacing:.1em;margin-right:9px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:17px;min-width:0;transition:transform .18s ease-out,border-color .2s,box-shadow .2s;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.card:hover{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-3px);border-color:var(--accent-line);box-shadow:var(--shadow)}
.card h3{margin:8px 0 6px;font-size:var(--fs-h3);line-height:1.5}
.card p{margin:0;font-size:var(--fs-sm);color:var(--muted)}
.card .k{font:var(--fs-cap) var(--mono);color:var(--faint);letter-spacing:.1em}
.card .idx{font:700 19px var(--mono);color:var(--accent-line);line-height:1;display:block;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:34px;padding:5px 13px;border:1px solid var(--line-strong);border-radius:var(--r-pill);font-size:13px;background:var(--surface);transition:border-color .18s,background .18s}
.chip:hover{border-color:var(--accent);background:var(--accent-soft)}
.note-line{font-size:12.5px;color:var(--muted);margin:14px 0 0}
.lnk{color:var(--accent);border-bottom:1px solid var(--accent-line)}
.lnk:hover{border-bottom-color:var(--accent)}
.stat{text-align:center}
.stat .v{display:block;font:600 19px var(--mono);color:var(--text);letter-spacing:-.02em;margin-top:6px;background:linear-gradient(135deg,var(--text) 30%,var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .k{display:block;margin-top:4px}

/* ---------- 表格 ---------- */
.table-wrap{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
th,td{text-align:left;padding:12px 13px;border:1px solid var(--line);vertical-align:top;line-height:1.6}
th{background:var(--surface-2);font-size:12px;color:var(--muted);font-weight:650;white-space:nowrap;letter-spacing:.02em}
tbody tr{transition:background .16s}
tbody tr:hover{background:var(--surface-2)}
td strong{color:var(--accent);font-weight:650}
.table-wrap table{border:0}
.table-wrap th,.table-wrap td{border-left:0;border-right:0}
.table-wrap tr:last-child td{border-bottom:0}

/* ---------- 流程 / FAQ ---------- */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);position:relative}
.steps:before{content:"";position:absolute;left:8%;right:8%;top:22px;height:1px;background:var(--line-strong);z-index:0}
.step{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:16px;position:relative;z-index:1;transition:border-color .18s,transform .18s}
.step:hover{border-color:var(--accent-line);transform:translateY(-2px)}
.step .dot{width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);margin-bottom:14px}
.step .mono{color:var(--accent);font-size:10px;letter-spacing:.1em;display:block;margin-bottom:4px}
.step strong{font-size:14px;display:block}
.step p{margin:5px 0 0;font-size:12px;color:var(--muted)}
details{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);margin-bottom:9px}
summary{min-height:46px;display:flex;align-items:center;padding:10px 16px;font-size:14px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font:17px var(--mono);color:var(--accent)}
details[open] summary::after{content:"−"}
details[open]{border-color:var(--accent-line)}
details .detail-body{padding:0 16px 15px;font-size:13px;color:var(--muted)}

/* ---------- 页脚 ---------- */
footer{background:var(--surface);border-top:1px solid var(--line);padding:44px 0 24px}
.foot-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:30px}
.foot-grid h4{margin:0 0 12px;font-size:12px;color:var(--faint);font-weight:650;letter-spacing:.08em}
.foot-grid ul{list-style:none;margin:0;padding:0}
.foot-grid li{margin-bottom:8px;font-size:13.5px}
.foot-grid li a:hover{color:var(--accent)}
.foot-bottom{border-top:1px solid var(--line);margin-top:30px;padding-top:17px;display:flex;gap:14px 20px;flex-wrap:wrap;align-items:baseline;font-size:12px;color:var(--muted)}
.foot-bottom .legal{display:flex;gap:14px;flex-wrap:wrap}
.foot-bottom .legal span{border-bottom:1px dotted var(--line-strong)}
.to-top{position:fixed;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);box-shadow:var(--shadow);display:none;place-items:center;z-index:40;font-size:17px;transition:border-color .18s}
.to-top:hover{border-color:var(--accent)}
.to-top.show{display:grid}

/* ---------- 入场动效 ---------- */
.js .reveal{opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s ease}
.js .reveal.in{opacity:1;transform:none}
/* Hero 分层入场（Tech Text 式逐行揭示，纯 CSS 延迟） */
.js .hero .eyebrow,.js .hero h1,.js .hero .lead,.js .hero .third,.js .hero .facts,.js .hero .link-row,.js .hero-art{
  opacity:0;transform:translateY(16px);animation:riseIn .7s cubic-bezier(.2,.7,.2,1) forwards}
.js .hero .eyebrow{animation-delay:.05s}
.js .hero h1{animation-delay:.13s}
.js .hero .lead{animation-delay:.22s}
.js .hero .third{animation-delay:.29s}
.js .hero .facts{animation-delay:.36s}
.js .hero .link-row{animation-delay:.43s}
.js .hero-art{animation-delay:.24s;transform:translateY(20px) scale(.985)}
@keyframes riseIn{to{opacity:1;transform:none}}
/* 标题关键词流光（Shiny Text 原生化） */
.hero h1 em{background:linear-gradient(100deg,var(--accent) 18%,var(--accent-2) 42%,var(--accent) 66%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shine 6s linear infinite}
.hero h1 em:after{-webkit-text-fill-color:initial;color:initial}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
/* 卡片描边扫光（Holo / Border Beam 原生化，hover 触发的边框流光） */
.card:after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:2;pointer-events:none;opacity:0;transition:opacity .3s;
  background:linear-gradient(115deg,transparent 20%,var(--accent) 42%,var(--accent-2) 50%,transparent 72%);
  background-size:250% 100%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
.card:hover:after{opacity:.85;animation:borderBeam 1.6s linear infinite}
@keyframes borderBeam{from{background-position:180% 0}to{background-position:-80% 0}}
/* 按钮内箭头轻推 */
.btn:hover{transform:translateY(-1px)}
.btn > span{display:inline-block;transition:transform .2s}
.btn:hover > span{transform:translateX(3px)}
/* 章节序号呼吸光点 */
.block-head .num:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent-2);margin-right:2px;animation:blip 2.8s ease-out infinite}

/* ---------- 滚动错落 / 卡片焦点切换 ---------- */
/* 错落入场：用独立 translate 属性，不干扰卡片 3D 倾斜所用的 transform */
.js .reveal.stagger{opacity:1;transform:none;transition:none}
.js .stagger > *{opacity:0;translate:0 18px;transition:opacity .5s ease,translate .5s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0) * 60ms)}
.js .stagger.in > *{opacity:1;translate:0 0}
/* 焦点切换：点选或悬停切换焦点卡，其余轻微退后；独立 scale 属性，不与 transform 冲突 */
.focus-switch > .card{cursor:pointer;transition:transform .2s ease-out,border-color .25s,box-shadow .25s,opacity .3s,scale .3s}
.focus-switch > .card.is-dim{opacity:.5;scale:.965}
.focus-switch > .card.is-focus{border-color:var(--accent-line);box-shadow:0 12px 30px var(--glow)}
.switch-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:15px}
.switch-dot{width:34px;height:34px;min-width:34px;border-radius:50%;display:grid;place-items:center;transition:background .2s}
.switch-dot:hover{background:var(--surface-2)}
.switch-dot:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line-strong);transition:width .28s,background .28s,border-radius .28s}
.switch-dot[aria-selected="true"]:before{width:22px;border-radius:6px;background:var(--accent)}
.switch-arrow{width:34px;height:34px;min-width:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:15px;transition:border-color .2s,color .2s}
.switch-arrow:hover{border-color:var(--accent);color:var(--accent)}
/* Hero 视觉轻微视差：滚动时写入 CSS 变量，纯 transform 合成 */
.hero .wrap{transform:translate3d(0,var(--hy,0px),0)}
.hero-art svg{transition:transform .2s ease-out;transform:translate3d(0,var(--ay,0px),0)}

/* ---------- 响应式 ---------- */
@media (max-width:960px){
  .hero-grid{grid-template-columns:1fr;gap:28px}
  .hero-art{max-width:440px}
}
@media (max-width:860px){
  .nav{display:none}
  .hamburger{display:grid}
  .top .wrap{gap:12px}
  .brand{font-size:14px}
  .foot-grid{grid-template-columns:1fr 1fr}
  .foot-grid > div:first-child{grid-column:1 / -1}
  table.plan thead{display:none}
  table.plan,table.plan tbody,table.plan tr,table.plan td{display:block;width:100%}
  table.plan tr{border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin:0 0 12px;background:var(--surface)}
  table.plan tr:last-child{margin-bottom:0}
  table.plan td{border:0;padding:5px 0;display:flex;gap:12px;align-items:baseline}
  table.plan td::before{content:attr(data-label);flex:0 0 72px;font:11px var(--mono);color:var(--faint)}
  .table-wrap{border:0;overflow:visible;background:transparent}
}
@media (max-width:768px){
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .steps:before{display:none}
  .block{padding:40px 0}
  .hero{padding:52px 0 42px}
}
@media (max-width:520px){
  .wrap{padding:0 16px}
  .grid2,.grid3,.grid4,.foot-grid,.steps{grid-template-columns:1fr}
  .foot-grid > div:first-child{grid-column:auto}
  .hero h1{font-size:28px}
  .hero .lead{font-size:15.5px}
}
@media (max-width:375px){
  .brand span:last-child{font-size:13px}
  .wrap{padding:0 14px}
  .hero h1{font-size:26px}
  .facts{gap:8px}
}
@media (max-width:320px){
  .wrap{padding:0 12px}
  .grid4,.grid3,.grid2{gap:10px}
  .card{padding:13px}
  .chip{font-size:12px;padding:5px 10px}
}
@media (min-width:1440px){
  .block{padding:62px 0}
  .hero{padding:88px 0 68px}
  .wrap{max-width:1220px}
}
@media (min-width:1920px){
  .wrap{max-width:1280px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
  .js .hero .eyebrow,.js .hero h1,.js .hero .lead,.js .hero .third,.js .hero .facts,.js .hero .link-row,.js .hero-art{opacity:1;transform:none}
  .js .stagger > *{opacity:1;translate:0 0}
  .card{transform:none}
  .focus-switch > .card.is-dim{opacity:1;scale:1}
  .hero .wrap,.hero-art svg{transform:none}
  .hero h1 em{-webkit-text-fill-color:initial;color:var(--accent);background:none}
  .card:after{display:none}
  .hero-art .draw{stroke-dashoffset:0}
}

/* ---------- 内容页专用（沿用首页设计 token） ---------- */
main{padding-bottom:56px}
.crumb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);padding:22px 0 0}
.crumb a{border-bottom:1px solid var(--line-strong)}
.crumb a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.page-head{margin:20px 0 24px}
.page-head .num{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--mono);color:var(--accent);border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r-sm);padding:4px 9px;min-height:26px;box-shadow:0 0 0 3px var(--glow)}
.page-head .num:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent-2);animation:blip 2.8s ease-out infinite}
.page-head h1{font-size:clamp(25px,3vw,33px);margin:12px 0 7px;letter-spacing:.01em;line-height:1.3}
.page-head .goal{margin:0;color:var(--muted);font-size:var(--fs-sm)}
.subnav{display:flex;gap:9px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:8px}
.subnav a{display:flex;align-items:center;min-height:44px;padding:8px 15px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:13.5px;background:var(--surface);transition:border-color .18s,background .18s}
.subnav a:hover{border-color:var(--accent-line)}
.subnav a.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:650}
.group{padding:50px 0}
.group-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.group-head .num{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--mono);color:var(--accent);border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r-sm);padding:4px 9px;min-height:26px;box-shadow:0 0 0 3px var(--glow)}
.group-head .num:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent-2);animation:blip 2.8s ease-out infinite}
.group-head h2{margin:0;font-size:var(--fs-h2);letter-spacing:.01em}
.group .goal{color:var(--muted);font-size:var(--fs-sm);margin:0 0 22px}
.mt{margin-top:var(--gap)}
.para{margin:0 0 14px;font-size:var(--fs-sm);color:var(--muted);line-height:1.85}
.para:last-child{margin-bottom:0}
.small{font-size:12px;color:var(--faint);margin:0 0 9px}
.timeline{display:grid;gap:14px;border-left:2px solid var(--accent-line);padding-left:20px;margin-left:9px}
.tl-item{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;transition:border-color .18s,transform .18s}
.tl-item:hover{border-color:var(--accent-line);transform:translateX(2px)}
.tl-item::before{content:"";position:absolute;left:-27px;top:16px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.tl-item .mono{font-size:var(--fs-cap);color:var(--accent);letter-spacing:.08em}
.tl-item h3{margin:3px 0 6px;font-size:var(--fs-h3)}
.tl-item p{margin:0;font-size:var(--fs-sm);color:var(--muted)}
.redirect{max-width:560px;margin:72px auto;text-align:center}
.redirect .tile{margin:0 auto 20px;width:56px;height:56px;border-radius:15px}
.redirect .tile .ico{width:28px;height:28px}
.redirect h1{font-size:26px;margin:0 0 12px}
.redirect p{color:var(--muted);font-size:14px;margin:0 0 24px;line-height:1.8}
.redirect .btn{min-width:200px}
@media(max-width:520px){.group{padding:34px 0}.redirect{margin:44px auto}}

</style>

  });

  var menuBtn = document.getElementById('menuBtn');
  var drawer = document.getElementById('drawer');
  function setDrawer(open){
    drawer.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    menuBtn.setAttribute('aria-label', open ? '关闭导航' : '打开导航');
  }
  menuBtn.addEventListener('click', function(){ setDrawer(!drawer.classList.contains('open')); });
  drawer.addEventListener('click', function(e){ if(e.target.tagName === 'A') setDrawer(false); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') setDrawer(false); });

  var map = [
    ['about','nav-about'],
    ['programs','nav-programs'],
    ['positions','nav-culture'],
    ['culture','nav-culture'],
    ['stories','nav-join'],
    ['join','nav-join']
  ];
  var navLinks = Array.prototype.slice.call(document.querySelectorAll('[data-nav]'));
  var bar = document.getElementById('topBar');
  var toTop = document.getElementById('toTop');
  var progress = document.getElementById('progress');
  function onScroll(){
    var cur = 'nav-about';
    map.forEach(function(pair){
      var el = document.getElementById(pair[0]);
      if(el && el.getBoundingClientRect().top <= 160) cur = pair[1];
    });
    navLinks.forEach(function(a){ a.classList.toggle('active', a.getAttribute('data-nav') === cur); });
    bar.classList.toggle('scrolled', window.scrollY > 8);
    toTop.classList.toggle('show', window.scrollY > 600);
    var maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    progress.style.width = (maxScroll > 0 ? Math.min(100, window.scrollY / maxScroll * 100) : 0) + '%';
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  window.addEventListener('resize', onScroll);
  onScroll();
  toTop.addEventListener('click', function(){
    window.scrollTo({top:0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  });

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 给错落组内的卡片写入序号，形成逐个浮现的节奏（纯 CSS 变量，不参与逐帧渲染）
  Array.prototype.forEach.call(document.querySelectorAll('.stagger'), function(group){
    Array.prototype.forEach.call(group.children, function(child, i){ child.style.setProperty('--i', i); });
  });
  if('IntersectionObserver' in window && !reduceMotion){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
      });
    }, {rootMargin:'0px 0px 60px 0px', threshold:0});
    Array.prototype.forEach.call(document.querySelectorAll('.reveal'), function(el){ io.observe(el); });
    // 非 reveal 的错落组（如嵌套在 surface 内的三阶段）单独观察
    Array.prototype.forEach.call(document.querySelectorAll('.stagger:not(.reveal)'), function(el){ io.observe(el); });
  }else{
    Array.prototype.forEach.call(document.querySelectorAll('.reveal,.stagger'), function(el){ el.classList.add('in'); });
  }

  // 成长见证：卡片焦点切换（点选 / 悬停 / 键盘左右）；三张卡始终留在页面，仅改变焦点
  (function(){
    var box = document.getElementById('storySwitch');
    var nav = document.getElementById('storyNav');
    if(!box || !nav) return;
    var cards = Array.prototype.slice.call(box.querySelectorAll('.card'));
    var dots = Array.prototype.slice.call(nav.querySelectorAll('.switch-dot'));
    var prev = document.getElementById('storyPrev');
    var next = document.getElementById('storyNext');
    var current = 0;
    function focus(i, doScroll){
      current = (i + cards.length) % cards.length;
      cards.forEach(function(c, k){
        c.classList.toggle('is-focus', k === current);
        c.classList.toggle('is-dim', k !== current);
      });
      dots.forEach(function(d, k){ d.setAttribute('aria-selected', k === current ? 'true' : 'false'); });
      if(doScroll && window.innerWidth <= 520 && cards[current].scrollIntoView){
        cards[current].scrollIntoView({behavior: reduceMotion ? 'auto' : 'smooth', block:'nearest', inline:'center'});
      }
    }
    cards.forEach(function(c, i){
      c.setAttribute('tabindex', '0');
      c.addEventListener('click', function(){ focus(i, true); });
      c.addEventListener('focus', function(){ focus(i, false); });
      c.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); focus(i, true); }
        if(e.key === 'ArrowRight'){ e.preventDefault(); focus(i + 1, true); cards[i + 1 >= cards.length ? 0 : i + 1].focus(); }
        if(e.key === 'ArrowLeft'){ e.preventDefault(); focus(i - 1, true); cards[i - 1 < 0 ? cards.length - 1 : i - 1].focus(); }
      });
    });
    dots.forEach(function(d, i){ d.addEventListener('click', function(){ focus(i, true); }); });
    if(prev) prev.addEventListener('click', function(){ focus(current - 1, true); });
    if(next) next.addEventListener('click', function(){ focus(current + 1, true); });
    nav.addEventListener('keydown', function(e){
      if(e.key === 'ArrowRight'){ e.preventDefault(); focus(current + 1, true); }
      if(e.key === 'ArrowLeft'){ e.preventDefault(); focus(current - 1, true); }
    });
    box.addEventListener('mouseover', function(e){
      var c = e.target && e.target.closest ? e.target.closest('.card') : null;
      if(c){ var i = cards.indexOf(c); if(i > -1 && i !== current) focus(i, false); }
    });
    focus(0, false);
  })();

  // Hero 视差：滚动量写入 CSS 变量，只做 transform 位移（合成层，无重排重绘）
  (function(){
    var hero = document.getElementById('top');
    if(!hero || reduceMotion) return;
    var wrap = hero.querySelector('.wrap');
    var art = hero.querySelector('.hero-art svg');
    if(!wrap) return;
    var ticking = false;
    function update(){
      if(ticking) return;
      ticking = true;
      requestAnimationFrame(function(){
        var y = Math.min(window.scrollY, 700);
        wrap.style.setProperty('--hy', (y * 0.045).toFixed(1) + 'px');
        if(art) art.style.setProperty('--ay', (y * -0.02).toFixed(1) + 'px');
        ticking = false;
      });
    }
    window.addEventListener('scroll', update, {passive:true});
  })();

  // 卡片聚光 + 轻微 3D 倾斜：把鼠标位置写入 CSS 变量，纯样式渲染，无逐帧循环
  var tiltCard = null;
  document.addEventListener('mousemove', function(e){
    var c = e.target && e.target.closest ? e.target.closest('.card') : null;
    if(!c){
      if(tiltCard){ tiltCard.style.setProperty('--rx','0deg'); tiltCard.style.setProperty('--ry','0deg'); tiltCard = null; }
      return;
    }
    var r = c.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width;
    var py = (e.clientY - r.top) / r.height;
    c.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    c.style.setProperty('--my', (e.clientY - r.top) + 'px');
    if(!reduceMotion && window.innerWidth > 860){
      c.style.setProperty('--rx', ((0.5 - py) * 4).toFixed(2) + 'deg');
      c.style.setProperty('--ry', ((px - 0.5) * 4).toFixed(2) + 'deg');
      tiltCard = c;
    }
  }, {passive:true});


})();

</script>
</body>
</html>
